<p-iftalabel *ngIf="showLabel" class="mb-4" [ngStyle]="{ width: width }">
  <ng-container *ngTemplateOutlet="fieldContent"></ng-container>
</p-iftalabel>

<ng-container *ngIf="!showLabel">
  <ng-container *ngTemplateOutlet="fieldContent"></ng-container>
</ng-container>

<ng-template #fieldContent>
  <div class="flex flex-col gap-1">
    <p-checkbox
      *ngIf="field.inputType === 'checkbox'"
      binary="true"
      [(ngModel)]="entity[field.key]"
      [name]="key + field.key"
      [inputId]="key + field.key"
      [attr.aria-describedby]="
        helperText ? key + field.key + '-help' : undefined
      "
    ></p-checkbox>

    <input
      *ngIf="field.inputType === undefined"
      pInputText
      [(ngModel)]="entity[field.key]"
      [name]="key + field.key"
      [placeholder]="placeholder"
      (blur)="onBlur($event)"
      [id]="key + field.key"
      [attr.aria-describedby]="
        helperText ? key + field.key + '-help' : undefined
      "
    />

    <textarea
      *ngIf="field.inputType === 'multiline'"
      pTextarea
      [(ngModel)]="entity[field.key]"
      [name]="key + field.key"
      [rows]="rows"
      [placeholder]="placeholder"
      (blur)="onBlur($event)"
      [id]="key + field.key"
      [attr.aria-describedby]="
        helperText ? key + field.key + '-help' : undefined
      "
    ></textarea>

    <p-inputNumber
      *ngIf="field.inputType === 'number'"
      [(ngModel)]="entity[field.key]"
      [name]="key + field.key"
      [placeholder]="placeholder"
      (blur)="onBlur($event)"
      [inputId]="key + field.key"
      [attr.aria-describedby]="
        helperText ? key + field.key + '-help' : undefined
      "
    ></p-inputNumber>

    <p-select
      *ngIf="field.inputType === 'select-literal'"
      [(ngModel)]="entity[field.key]"
      [name]="key + field.key"
      [options]="getOptionValues(field.key)"
      (blur)="onBlur($event)"
      [inputId]="key + field.key"
      styleClass="w-full"
      [attr.aria-describedby]="
        helperText ? key + field.key + '-help' : undefined
      "
      [appendTo]="selectPopupAppendTo"
    />

    <p-calendar
      *ngIf="field.inputType === 'date'"
      [(ngModel)]="entity[field.key]"
      [name]="key + field.key"
      (blur)="onBlur($event)"
      [inputId]="key + field.key"
      [attr.aria-describedby]="
        helperText ? key + field.key + '-help' : undefined
      "
    ></p-calendar>

    <p-message
      *ngIf="form.form.get(field.key)?.errors"
      severity="error"
      text="{{ form.form.get(field.key)?.errors }}"
      variant="simple"
      size="small"
    ></p-message>

    <small
      *ngIf="helperText"
      [id]="key + field.key + '-help'"
      [innerHTML]="helperText"
    ></small>

    <label *ngIf="showLabel" [for]="key + field.key">{{
      label || field.caption
    }}</label>
  </div>
</ng-template>
