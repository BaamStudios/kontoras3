<ng-container *ngIf="entity">
  <div class="flex justify-between align-items-center mb-3">
    <h1>{{ "invoice" | translate }}: {{ entity.displayName }}</h1>

    <div class="flex gap-2">
      <p-button
        class="whitespace-nowrap"
        [routerLink]="['/om/invoice']"
        icon="pi pi-list"
        [label]="'overview' | translate"
        severity="secondary"
      ></p-button>
      <p-button
        class="whitespace-nowrap"
        (click)="confirmDelete()"
        icon="pi pi-trash"
        [label]="'deleteInvoice' | translate"
        severity="danger"
      ></p-button>
      <p-button
        class="whitespace-nowrap"
        [routerLink]="['./edit']"
        icon="pi pi-pencil"
        [label]="'editInvoice' | translate"
      ></p-button>
    </div>
  </div>

  <!-- <p-card> -->
    <pdf-viewer
      [src]="'/api/invoice/pdf?id=' + entity.id"
      [autoresize]="false"
      [fit-to-page]="true"
      style="height: 1200px"
    ></pdf-viewer>
  <!-- </p-card> -->

  <p-dialog
    [(visible)]="showConfirmDeleteModal"
    [header]="'deleteInvoice' | translate"
    [modal]="true"
    [style]="{ width: '450px' }"
  >
    <div class="flex flex-column gap-3">
      <p
        [innerHTML]="
          'confirmDeleteInvoice'
            | translate : { displayName: entity.displayName }
        "
      ></p>
    </div>
    <ng-template pTemplate="footer">
      <p-button
        (click)="showConfirmDeleteModal = false"
        [label]="'no' | translate"
        severity="secondary"
        styleClass="p-button-text"
      ></p-button>
      <p-button
        (click)="delete()"
        [label]="'yes' | translate"
        severity="danger"
      ></p-button>
    </ng-template>
  </p-dialog>
</ng-container>
